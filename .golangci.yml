# Shared org golangci-lint config for collector repos + SDK modules.
# Pinned to golangci-lint v2.12.2 (same binary Eshu uses).
# Org lint set only: govet, staticcheck (which subsumes gosimple in v2),
# ineffassign, unused, errcheck; formatter gofumpt. No baselines,
# no new-from-rev.
#
# max-issues-per-linter: 0 and max-same-issues: 0 disable result
# truncation: the defaults (50/3) hid 6 of this repo's 11 errcheck findings
# behind the first 5, so the scan counted 8 lint findings instead of 14.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules: []

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
