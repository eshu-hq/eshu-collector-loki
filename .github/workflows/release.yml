name: release

# Publishes the collector image on every push to main and on every pushed
# version tag. Nothing runs on a pull request, and nothing here deploys.
# A version tag must point at the protected main head and match the manifest
# version: a v* tag cut from any other commit, or for any other version,
# fails before anything is built or pushed. A person copies the digest from
# the job summary into the activation's seed.image (README, "Releasing").
# Pushes to main publish the moving main, latest, and sha-<full-sha> tags
# with the same provenance, signature, SBOM, and attestation hardening as
# version-tag releases.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require a semantic version tag
        if: github.ref_type == 'tag'
        run: |
          if ! printf '%s' "${TAG_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag '${TAG_NAME}' is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag to point at the protected main head
        if: github.ref_type == 'tag'
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main --quiet
          main_head="$(git rev-parse origin/main)"
          if [[ "${TAG_COMMIT}" != "${main_head}" ]]; then
            echo "tag '${TAG_NAME}' points at ${TAG_COMMIT}, not the protected main head ${main_head}" >&2
            exit 1
          fi
      - name: Require the tag to match the manifest version
        if: github.ref_type == 'tag'
        run: |
          version="$(awk '
            /^metadata:/ { in_metadata = 1; next }
            /^[^[:space:]#]/ { in_metadata = 0 }
            in_metadata && /^  version:/ { print $2; exit }
          ' manifest.yaml | tr -d "\"'\r")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "manifest.yaml metadata.version is not MAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          matches=false
          if [[ "${TAG_NAME}" == "v${version}" ]]; then
            matches=true
          fi
          if [[ "${version}" != *-* && "${TAG_NAME}" == "v${version}-"* ]]; then
            matches=true
          fi
          if [[ "${matches}" != true ]]; then
            echo "tag '${TAG_NAME}' does not match manifest.yaml metadata.version 'v${version}'" >&2
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata (tag events)
        id: meta-tag
        if: github.ref_type == 'tag'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
      - name: Extract image metadata (main-branch pushes)
        id: meta-branch
        if: github.ref_type == 'branch'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta-tag.outputs.tags }}
            ${{ steps.meta-branch.outputs.tags }}
          labels: |
            ${{ steps.meta-tag.outputs.labels }}
            ${{ steps.meta-branch.outputs.labels }}
      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Image"
            echo
            echo "- Tag: \`${REGISTRY}/${IMAGE_NAME}:${TAG_NAME}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Reference: \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`"
            echo
            echo "Copy the reference into the activation's seed.image."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      - name: Verify the image signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Generate the image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: eshu-collector-loki.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate the SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: eshu-collector-loki.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify the image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3
