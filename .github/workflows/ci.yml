# CI gates for eshu-collector-loki.
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below).
# This file holds the paths-filter `changes` job, the `lanes` call with
# this repo's run-gate wiring, three jobs the reusable cannot own
# (`conformance`, `scheduled-findings`, `gosec-sarif`), and the
# `ci-complete` aggregator. Stable job names (org contract; only
# ci-complete is ever required in a ruleset): changes, lanes, conformance,
# scheduled-findings, gosec-sarif, ci-complete. The lane set inside `lanes`
# is lint, test, race, shell, image, boundary, govulncheck, gosec,
# actionlint (check runs nest as `lanes / <lane>`), identical to the
# retired inline lane names, so the required `ci-complete` context never
# churns.
#
# The reusable v2 grew every input this repo waited on: path gates for
# govulncheck/gosec/actionlint/boundary, package-mode govulncheck (Go 1.26
# SSA-safe), a never-blocking gosec whose findings ride an artifact, and
# actionlint and image hooks. Pinned to the v2 merge commit, never the tag.
#
# Accepted deltas of the move (documented, not silent):
# - gosec stays advisory on PRs (follow-up #14 stays open and time-gated:
#   gosec-fail-on-findings is schedule-only, so scheduled findings fail
#   red exactly as before). The Security-tab SARIF upload moved to the
#   caller job gosec-sarif (non-PR events only, continue-on-error, fed by
#   the reusable's gosec-loki artifact).
# - Scheduled issue filing: the two per-scan steps (govulncheck, gosec)
#   became one combined caller job, scheduled-findings, because the
#   reusable cannot report per-lane results to the caller. It fires only
#   when `lanes` failed on a schedule event, and lists-or-comments.
# - The `test` lane is the reusable's go build + go test. The retired
#   lane ran scripts/run-conformance.sh (build, vet, race tests); that
#   script now runs in the caller job `conformance` under the retired
#   test-lane gate, so a script-only PR still executes it.
# - The lint lane installs golangci-lint v2.12.2 with go install instead
#   of golangci/golangci-lint-action (same version, no action-side
#   cache), and the 500-line cap scans with find instead of git ls-files.
#   The `git diff --check` step was vacuous (a fresh checkout has no
#   unstaged diff); gofumpt, tidy, and actionlint cover formatting. `make
#   lint` keeps it locally.
# - actionlint runs from the sha256-checked v1.7.12 release tarball
#   (reusable) instead of the rhysd/actionlint action; same version.
# - shellcheck runs via the reusable's ludeeus/action-shellcheck 2.0.0
#   pin instead of the retired master SHA 00b27aa7; the reusable
#   has no shellcheck version input.
# - The coverage summary is the reusable `go tool cover -func` tail; the
#   90.1 floor literal moves to the coverage-floor input, pinned equal to
#   the Makefile by TestCoverageFloorParity.
# - lanes carries no timeout-minutes (the schema forbids it on reusable
#   calls); each inner lane keeps the retired timeout (lint/race/image 15,
#   test/boundary/govulncheck 10, gosec 30, shell/actionlint 5).
#
# Pinned actions (SHAs re-resolved 2026-11-01 via git ls-remote; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go v7.0.0              b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (passed as reusable inputs; hash-verified by the toolchain on
# install):
#   golangci-lint v2.12.2 (config in .golangci.yml)
#   govulncheck v1.9.0, run with -scan package (Go 1.26 SSA-safe)
#   gosec v2.30.0, never blocking on PRs; scheduled runs with findings
#   fail red (follow-up #14)
#   actionlint v1.7.12 (tarball sha256 8aca8db9...a3d8, checked upstream)

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC: every lane runs, like a push
  workflow_dispatch: # manual runs execute every lane, like a push

permissions:
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green (observed on post-merge main run 40611978095).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Every entry is grep-proven test- or embed-consumed:
              # loki/testdata/** via loki/extraction_prep_golden_test.go:104
              # (os.ReadFile testdata/8860-parity-loki.json),
              # **/*.json via grant_test.go:45
              # (os.ReadFile grant.example.json),
              # config.example.yaml via config_example_test.go:20
              # (os.ReadFile config.example.yaml),
              # manifest.yaml via manifest_embed.go:12
              # (go:embed manifest.yaml) plus testhelpers_test.go:137
              # (os.ReadFile manifest.yaml).
              - 'testdata/**'
              - '**/testdata/**'
              - '**/*.json'
              - 'manifest.yaml'
              - 'grant.example.json'
              - 'config.example.yaml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              # manifest.yaml is go:embed'ed into the binary
              # (manifest_embed.go:12), so a manifest change rebuilds
              # the image.
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
            workflows:
              - '.github/workflows/**'
            misc:
              # Default required by the epic: anything not classified above
              # runs the full Go lanes. Docs-only must keep skipping, so the
              # docs skip set stays negated here; every classified pattern is
              # negated too so narrow lanes (fixtures/shell/image) keep their
              # shape. Proven by the docs-only / fixture-only skip proofs.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/testdata/**'
              - '!**/*.json'
              - '!manifest.yaml'
              - '!grant.example.json'
              - '!config.example.yaml'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  lanes:
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: loki
      go-version-file: go.mod
      coverage-floor: 90.1
      # Pin every tool the retired lanes pinned. Reusable defaults float
      # across tags; this move must neither downgrade nor silently upgrade
      # a scanner. (gosec stays at v2.30.0, newer than the reusable default.)
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' }}
      run-image: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      image-tag: eshu-collector-loki:ci
      image-context: .
      image-command: |
        set -euo pipefail
        seed="$RUNNER_TEMP/seed"
        mkdir -p "$seed" && chmod 777 "$seed"
        docker run --rm --network none -v "$seed:/component" eshu-collector-loki:ci seed --dest /component
        test -x "$seed/collector"
        test -s "$seed/manifest.yaml"
        total=$(grep -Ec '^[[:space:]]*image:' manifest.yaml)
        pinned=$(grep -Ec '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+@sha256:[0-9a-f]{64}[[:space:]]*$' manifest.yaml)
        echo "manifest image refs: $pinned/$total digest-pinned"
        [ "$pinned" -ge 1 ] && [ "$pinned" -eq "$total" ]
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -eq "$from_total" ]
      run-boundary: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      # A Go-only change can newly reach a vulnerable symbol in an already
      # present dependency, so Go PRs scan too.
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      # Findings fail scheduled runs so the failure()-gated findings job
      # below is reachable; PR runs stay advisory green (follow-up #14).
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true' }}

  conformance:
    needs: [changes]
    # Shell edits trip this on purpose, so a script-only PR still runs the
    # script and a mirror-breaking edit fails here, not just shellcheck. The
    # reusable test lane runs plain build + test and cannot run it.
    # Fixture-only edits do not: the test lane already runs the same
    # go test over them (arbiter ruling, #8).
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The conformance script IS this job's body (build, vet, race gate);
      # `make ci` runs it too. Never re-inline these commands here: a
      # second copy is a mirror that drifts.
      - name: conformance
        run: bash scripts/run-conformance.sh

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. One combined govulncheck+gosec issue (the reusable cannot
    # report per-lane results to the caller): fires only when lanes failed
    # on a schedule event, and lists-or-comments instead of duplicating.
    needs: [lanes]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          title="[ci] weekly scan findings $(date -u +%F)"
          body="Scheduled govulncheck/gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run
    # read-only): caller-side, non-PR events only, and continue-on-error
    # so a 403 never turns into a silent green no-op. Skips when lanes
    # failed (including scheduled-finding runs): the finding count stays in
    # that run's summary and the weekly issue links the run.
    needs: [lanes]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-loki
          path: ${{ github.workspace }}
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  ci-complete:
    needs: [changes, lanes, conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job OBJECTS never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Proven by the seeded red/green lane proofs in the
          # closing PR; never change this shape without re-seeding.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
