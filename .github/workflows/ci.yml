name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofumpt
        run: |
          unformatted="$(go run mvdan.cc/gofumpt@v0.11.0 -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofumpt would change:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build the image without pushing it
        run: docker build -t eshu-collector-loki:ci .
      - name: Seed contract
        run: |
          seed="$RUNNER_TEMP/seed"
          mkdir -p "$seed" && chmod 777 "$seed"
          docker run --rm --network none -v "$seed:/component" eshu-collector-loki:ci seed --dest /component
          test -x "$seed/collector"
          test -s "$seed/manifest.yaml"

  ci-complete:
    if: always()
    needs: [vet, test, boundary, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job finished with: $result" >&2
              exit 1
            fi
          done
